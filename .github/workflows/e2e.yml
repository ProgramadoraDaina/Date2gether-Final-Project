name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mismo Postgres descartable que docker-compose.test.yml usa en local
    # (ver el comentario de ese archivo): un service container, puerto 5433,
    # mismas credenciales. GitHub Actions corre el job directo en la VM, así
    # que el mapeo de puerto queda accesible en localhost para los pasos de
    # abajo sin tocar nada más.
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: date2gether_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d date2gether_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Sin "version:": lee el campo packageManager de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # El service container ya está healthy antes de este paso (GitHub
      # Actions no arranca steps hasta que pasa el healthcheck).
      - run: pnpm test:e2e:db:migrate

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
