 global HttpOnlyThrottlerGuard reads via Reflector at runtime, so production behavior is unchanged -- only the import path differs to dodge the Jest-only cycle. FLAGGING FOR sdd-verify and any future PR: this same workaround pattern will be needed again for any other new controller/service that must combine @nestjs/common with @nestjs/throttler (or potentially other @nestjs/* packages with the same ESM/CJS interop shape) while staying unit-testable without a full createApp(AppModule) integration test -- and a full createApp(AppModule) integration test is ITSELF still blocked by the original PR1-documented cycle, so there is currently no way to assert this behavior end-to-end (real HTTP request through the real global ThrottlerGuard) under this test setup. Recorded as a known gap, not silently resolved: the unit-level metadata assertion in calls-webhook.controller.spec.ts proves the correct metadata key/value is set; it does not prove HttpOnlyThrottlerGuard actually reads and honors it (that guard's own behavior is @nestjs/throttler's responsibility and out of this PR's code, but the integration seam is untested in this repo)."
