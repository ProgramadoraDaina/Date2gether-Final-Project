change: call-participation-timeline
created: 2026-11-06
description: >
  Post-call participation timeline/dashboard: per-participant join/leave times
  from LiveKit, duration, whether their mic was open ("spoke"), and whether
  they screen-shared, keyed off new LiveKit webhooks. Also enforces the host rule
  "no admin, no call": joining the videocall requires at least one connected room
  administrador, and the departure of the last connected admin force-closes the
  LiveKit session for everyone (which is what reliably triggers room_finished and
  the timeline materialization).

