    - "DECISIÓN DE DISEÑO NO ESPECIFICADA EN design.md, RESUELTA Y DOCUMENTADA (UX exacta de 'Volver a la sala'): design.md dice textualmente que el panel terminal lleva 'un link Ver línea de tiempo y Volver a la sala' sin especificar el comportamiento concreto de ese segundo control. No existe (en este PR ni en ninguno anterior) un flujo de 'reingresar a la llamada después de un cierre forzado' -- joinCall() ya está completo del lado del hook, pero conectar un botón a él reabriría la MISMA llamada que el admin recién cerró, lo cual no fue pedido ni por la propuesta ni por el diseño. Se implementó 'Volver a la sala' como un botón que simplemente DESCARTA el panel terminal (estado local callEndedDismissed), dejando ver el chat/sala sin ningún widget de llamada en su lugar (ni video, ni spinner, ni botón de reintentar) -- no hay manera de volver a entrar a la llamada desde esa pantalla sin refrescar la página. Esto es consistente con el alcance declarado ('la sala y su chat siguen vivos') pero es una interpretación, no una especificación: si el producto espera que 'Volver a la sala' reinicie el intento de unirse a la videollamada, hay que decirlo explícitamente y es un cambio de una línea (llamar a joinCall en vez de solo descartar el panel)."
