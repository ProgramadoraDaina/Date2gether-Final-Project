    - "ENVIRONMENT BUG DISCOVERED (unrelated to this PR's logic, blocking if not worked around): importing AppModule directly in a spec file under this project's Jest ESM config (NODE_OPTIONS=--experimental-vm-modules + ts-jest useESM) throws 'Cannot require() ES Module ... in a cycle' originating in @nestjs/throttler's decorator module. Reproduced in isolation with a throwaway probe spec (removed). No existing spec had hit this because none imported AppModule directly (calls.module.spec.ts imports CallsModule+DrizzleModule directly, bypassing ThrottlerModule). Worked around by making app-setup.ts's createApp(module) take the module as a MANDATORY parameter instead of defaulting to AppModule internally, so app-setup.ts itself never imports app.module.ts; main.ts imports and passes AppModule explicitly. Flagging for sdd-verify / later PRs: any future spec that needs the real AppModule wiring will hit this same cycle and need the same workaround (pass a narrower test module, or investigate upgrading/patching @nestjs/throttler)."
